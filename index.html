<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffd166">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Familien-Entdecker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ages.css">
</head>
<body>
  <!-- Startseite: Wer spielt heute? -->
  <section id="start" class="screen active">
    <h1>Wer spielt heute?</h1>
    <div class="ages">
      <button class="age a2" data-go="menu"><span class="ai">👶</span><b>2 Jahre</b><small>Kleine Entdecker</small></button>
      <button class="age a7" data-go="menu7"><span class="ai">🧒</span><b>7 Jahre</b><small>Entdecker-Akademie</small></button>
      <button class="age a17" data-go="menu17"><span class="ai">🧑</span><b>17 Jahre</b><small>Skills Lab</small></button>
    </div>
  </section>

  <!-- Hauptmenü 2 Jahre -->
  <section id="menu" class="screen">
    <button class="tile" data-go="bauen" style="--c:#06aed5" aria-label="Häuser bauen">🏡</button>
    <button class="tile" data-go="bauen3d" style="--c:#7b2cbf" aria-label="3D bauen">🏰</button>
    <button class="tile" data-go="autos" style="--c:#ef476f" aria-label="Autos mit Liedern">🚒</button>
    <button class="tile" data-go="klavier" style="--c:#8d6e63" aria-label="Klavier">🎹</button>
    <button class="tile" data-go="tiere" style="--c:#ff9f1c" aria-label="Tiere">🐮</button>
    <button class="tile" data-go="namen" style="--c:#80b918" aria-label="Wer ist das? Tiernamen">🦒</button>
    <button class="tile" data-go="musik" style="--c:#e71d73" aria-label="Xylophon">🎵</button>
    <button class="tile" data-go="farben" style="--c:#2ec4b6" aria-label="Farben">🎈</button>
    <button class="tile" data-go="blasen" style="--c:#5e60ce" aria-label="Seifenblasen">🫧</button>
  </section>

  <!-- Tiere -->
  <section id="tiere" class="screen">
    <div class="grid" id="animalGrid"></div>
  </section>

  <!-- Wer ist das? Tiernamen -->
  <section id="namen" class="screen">
    <div id="habitats"></div>
    <div id="nameGrid"></div>
  </section>

  <!-- Farben / Ballons -->
  <section id="farben" class="screen">
    <div id="balloonArea"></div>
  </section>

  <!-- Musik / Xylophon -->
  <section id="musik" class="screen">
    <div id="xylophone"></div>
  </section>

  <!-- Seifenblasen / Tippen überall -->
  <section id="blasen" class="screen">
    <div id="bubbleArea"></div>
  </section>

  <!-- Bauen mit Magnetplatten -->
  <section id="bauen" class="screen">
    <button class="modeSwitch" data-mode="bauen3d" aria-label="In 3D bauen">🏰 3D</button>
    <div class="navBuild"><button data-dir="-1" aria-label="Vorheriges Bauwerk">◀</button><button data-dir="1" aria-label="Nächstes Bauwerk">▶</button></div>
    <div id="buildZone"><div class="ground"></div></div>
    <div class="palette">
      <button class="pal" data-shape="sq" aria-label="Viereck"></button>
      <button class="pal" data-shape="rect" aria-label="Rechteck"></button>
      <button class="pal" data-shape="tri" aria-label="Dreieck"></button>
      <button class="pal" data-shape="semi" aria-label="Halbkreis"></button>
      <button class="pal" data-shape="door" aria-label="Tür" hidden></button>
      <button class="pal" data-shape="stairs" aria-label="Treppe" hidden></button>
      <button class="pal" data-shape="win" aria-label="Fenster" hidden></button>
      <button class="pal" data-shape="chim" aria-label="Schornstein" hidden></button>
    </div>
  </section>

  <!-- 3D bauen -->
  <section id="bauen3d" class="screen">
    <button class="modeSwitch" data-mode="bauen" aria-label="Flach bauen">🏡 2D</button>
    <div class="navBuild"><button data-dir="-1" aria-label="Vorheriges Bauwerk">◀</button><button data-dir="1" aria-label="Nächstes Bauwerk">▶</button></div>
    <div id="scene3d"><div id="stage3d"></div></div>
    <div class="palette">
      <button class="pal" data-shape="sq" aria-label="Viereck"></button>
      <button class="pal" data-shape="rect" aria-label="Rechteck"></button>
      <button class="pal" data-shape="tri" aria-label="Dreieck"></button>
      <button class="pal" data-shape="semi" aria-label="Halbkreis"></button>
      <button class="pal" data-shape="door" aria-label="Tür" hidden></button>
      <button class="pal" data-shape="stairs" aria-label="Treppe" hidden></button>
      <button class="pal" data-shape="win" aria-label="Fenster" hidden></button>
      <button class="pal" data-shape="chim" aria-label="Schornstein" hidden></button>
    </div>
  </section>

  <!-- Klavier -->
  <section id="klavier" class="screen">
    <div id="piano"></div>
  </section>

  <!-- Autos mit Kinderliedern -->
  <section id="autos" class="screen">
    <div id="garage"></div>
  </section>

  <!-- 7 Jahre / 17 Jahre (Inhalt wird per JavaScript aufgebaut) -->
  <section id="menu7" class="screen t7"></section>
  <section id="game7" class="screen t7"></section>
  <section id="menu17" class="screen t17"></section>
  <section id="game17" class="screen t17"></section>

  <button id="home" aria-label="Zurück">⬅️</button>
  <button id="toMenu" aria-label="Zum Menü">🏠 Zum Menü</button>
  <button id="lang" aria-label="Sprache umschalten"><i class="flag"></i><b>DE</b></button>
  <div id="toast" role="status"></div>

  <script src="app.js"></script>
  <script src="kids7.js"></script>
  <script src="teen17.js"></script>
</body>
</html>
